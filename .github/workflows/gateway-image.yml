# Fork-only workflow (0x0501/CLIProxyAPI): builds the tokenswim-gateway image
# (Dockerfile.gateway) and pushes it to GHCR on gateway-v* tags.
# Upstream's tag-triggered workflows (docker-image.yml, release.yaml) are
# disabled on this fork GitHub-side via `gh workflow disable` — no file edits,
# so upstream syncs never conflict.
name: 🐳 Publish Gateway Image (GHCR)

on:
  push:
    tags:
      - gateway-v*
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/0x0501/tokenswim-gateway

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute version
        # gateway-v1.2.3 -> 1.2.3; on workflow_dispatch this is the branch name (e.g. "main")
        run: echo "VERSION=${GITHUB_REF_NAME#gateway-v}" >> "$GITHUB_ENV"
      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gateway
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
