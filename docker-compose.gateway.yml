# Standalone VPS deployment for tokenswim-gateway (ghcr image built by
# .github/workflows/gateway-image.yml).
#
# The gateway has NO caller authentication: /invoke executes with whatever
# credential the request body carries. 8787 is published on all interfaces,
# so restrict reachability outside compose — firewall/security group allowing
# only your Worker's egress, or a TLS reverse proxy in front.
#
# Health probe: GET /healthz — external only; the distroless image has no
# shell/curl, so an in-container docker healthcheck is not possible.
services:
  gateway:
    image: ghcr.io/0x0501/tokenswim-gateway:latest
    container_name: tokenswim-gateway
    restart: unless-stopped
    read_only: true
    ports:
      - "8787:8787"
    # environment:
    #   PROXY_URL: socks5://user:pass@host:port  # optional: route upstream provider traffic through a forward proxy
